# Publishes to npm when a version tag (v1.2.3) is pushed, using npm trusted
# publishing (OIDC): no npm token is stored anywhere. Provenance attestations are
# generated automatically. The `npm` environment requires approval before the
# job runs, and only accepts v* tags. After a successful publish, the major
# version tag (v0) that GitHub Action users reference is moved to the release.
#
# This file name (release.yml) and the environment name (npm) must match the
# trusted publisher configured on npmjs.com.
name: Release

on:
  push:
    # Full versions only, so moving the v0 tag can never start a release.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # lets npm verify this workflow instead of a token

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No dependency cache in the publish job, as in npm's trusted publishing example.
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@11

      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Check action.yml runs this exact version
        run: node scripts/sync-action-version.mjs --check

      - name: Skip if this version is already on npm
        id: published
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@akojif/flowdiff@$version" version >/dev/null 2>&1; then
            echo "::notice::@akojif/flowdiff@$version is already published; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
        if: steps.published.outputs.skip != 'true'

      # prepublishOnly runs lint, typecheck, tests and the build first.
      - run: npm publish
        if: steps.published.outputs.skip != 'true'

  update-major-tag:
    name: Move the v0 tag
    # Runs only after the approved publish job has succeeded.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # to move the tag; tags pushed with this token start no workflows
    steps:
      - uses: actions/checkout@v5

      - name: Point the major version tag at this release
        run: |
          major="${GITHUB_REF_NAME%%.*}" # v0.1.2 -> v0
          git tag --force "$major" "$GITHUB_SHA"
          git push --force origin "refs/tags/$major"
          echo "::notice::$major now points at $GITHUB_REF_NAME ($GITHUB_SHA)"
